# Configuration for adding images
add_images:
  # Number of images to add
  min_count: 2
  max_count: 4
  
  # Rotation settings (in degrees)
  min_rotate: -30.0
  max_rotate: 30.0
  
  # Zoom settings base on biggest child
  min_zoom: 0.8
  max_zoom: 1.0
 
  # Placement settings
  ovl_ratio: 0.2     # overlap ratio
  edge_ratio: 0.2     
  none_ratio: 0.2
  
  min_visibility: 0.7 # Minimum required visibility ratio
  max_attempts: 10000 # Maximum number of attempts to place an object

  blend_mode: 