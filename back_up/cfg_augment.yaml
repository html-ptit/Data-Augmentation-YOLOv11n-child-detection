# Configuration for adding images
add_images:
  data_path: train
  output_dir: add_image_data
  # Number of images to add
  min_count: 2
  max_count: 4

  # Rotation settings (in degrees)
  min_rotate: -30.0
  max_rotate: 30.0

  # Zoom settings base on biggest child
  min_zoom: 0.55
  max_zoom: 0.6

  # Placement settings
  ovl_ratio: 5 # overlap ratio
  edge_ratio: 5
  none_ratio: 5

  #in case edge
  min_visibility: 0.4
  max_visibility: 0.6

  max_attempts: 1000000 # Maximum number of attempts to place an object

  blend_mode:

add_effect:
  data_path: train
  apply_noise_ratio: 0.25
  apply_light_shift_ratio: 0.25
  output_dir: add_effect_data
