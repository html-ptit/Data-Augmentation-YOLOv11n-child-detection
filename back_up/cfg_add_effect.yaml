# Effect ratios
ratios:
  blur: 0.5
  noise: 0.5
  histogram_equalization: 0.3
  contrast_stretching: 0.5
  blend: 0.5
  stripes: 0.3
  spatial_filter: 0.4
  thresholding: 0
  color_matching: 0.4
  color_grading: 0.4

# Parameters boundaries
params:
  blur:
    min: 3
    max: 15  # Kernel size (odd numbers only)
  
  noise:
    min: 5
    max: 30  # Noise standard deviation
  
  contrast:
    min: 0.5
    max: 2.0  # Contrast factor
  
  stripes:
    min_width: 1
    max_width: 10  # Width of stripes
    min_opacity: 0.05
    max_opacity: 0.3  # Opacity of stripes
    min_count: 3
    max_count: 15  # Number of stripes
  
  blend:
    min: 0.1
    max: 0.5  # Blending factor
  
  spatial_filter:
    min: 3
    max: 9  # Filter kernel size
  
  threshold:
    min: 80
    max: 220  # Threshold value
  
  color_matching:
    min_strength: 0.3
    max_strength: 0.8  # Color matching strength
    reference_colors:
      - [40, 80, 120]  # Cool blue
      - [180, 70, 50]  # Warm orange
      - [50, 120, 50]  # Forest green
      - [120, 60, 150]  # Purple
      - [200, 180, 40]  # Yellow
  
  color_grading:
    shadows:
      min: -30
      max: 30  # Adjustment for shadows
    midtones:
      min: -20
      max: 20  # Adjustment for midtones
    highlights:
      min: -30
      max: 30  # Adjustment for highlights
    saturation:
      min: 0.8
      max: 1.3  # Saturation adjustment